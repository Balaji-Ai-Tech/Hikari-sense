[project]
name = "hikari-sense-backend"
version = "0.1.0"
description = "HIKARI SENSE backend for PS 26069 — National Weather Big Data Analytics Platform (MoES / IMD)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "The WIND BREAKERS" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "httpx>=0.27",
  "PyJWT>=2.9",
  "cryptography>=43.0",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "minio>=7.2",
  "aiokafka>=0.12",
  "kafka-python>=2.0",
  "feedparser>=6.0",
  "Pillow>=11.0",
  "ImageHash>=4.3",
  "h3>=4.1",
  "email-validator>=2.2",
]

[project.optional-dependencies]
ml = ["torch", "transformers", "mlflow"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
